apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-fetch-config-data
spec: 
  replicas: 1
  selector:
    matchLabels:
      app: config-demo
  template:
    metadata:
      labels:
        app: config-demo
    spec:
      containers:
        - name: nginx
          image: nginx
          ports:
            - containerPort: 80
          env:
            - name: DEPARTMENT
              valueFrom:
                configMapRef:
                  name: app-config
                  key: DEPARTMENT
            - name: ENV
              valueFrom:
                configMapRef:
                  name: app-config
                  key: ENV



      