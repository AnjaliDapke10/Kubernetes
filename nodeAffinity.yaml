apiVersion: v1 
kind: Pod 
metadata: 
  name: simple-affinity-pod 
spec: 
  affinity: 
    nodeAffinity: 
      # 1. HARD RULE: Must be satisfied, otherwise Pod stays Pending 
      requiredDuringSchedulingIgnoredDuringExecution: 
        nodeSelectorTerms: 
        - matchExpressions: 
          - key: os 
            operator: In 
            values: 
            - linux 
 
      # 2. SOFT RULE: Strongly prefer this zone, but fallback if unavailable 
      preferredDuringSchedulingIgnoredDuringExecution: 
      - weight: 80 
        preference: 
          matchExpressions: 
          - key: zone 
            operator: In 
            values: 
            - zone-a