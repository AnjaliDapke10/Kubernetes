apiVersion: v1
kind: Secret
metadata:
  name: app-secret
data:
  DB_PASSWORD: YWRtaW5AMTIz

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-fetch-secret-data
spec: 
  replicas: 1
  selector:
    matchLabels:
      app: secret-demo
  template:
    metadata:
      labels:
        app: secret-demo
    spec:
      containers:
        - name: nginx
          image: nginx
          ports:
            - containerPort: 80
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DB_PASSWORD
           


      