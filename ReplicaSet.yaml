apiVersion: apps/v1       
kind: ReplicaSet
metadata:
  name: frontend-rs
spec:
  replicas: 3
  selector:
    matchLabels: 
      app: frontend
    matchExpressions:
      - { key: env, operator: In, values: [dev] }
  template:
    metadata:
      labels:
        app: frontend
        env: dev
    spec:
      containers:
          - name: nginx
            image: nginx
            ports:
              - containerPort: 80