apiVersion: apps/v1       
kind: ReplicaSet
metadata:
  name: frontend-rs
spec:
  replicas: 3
  selector:
    matchlables: 
      app: frontend
    matchexpressions:
      - { key: env, operator: In, values: [dev] }
  template:
    metadata:
      labels:
        app: frontend
        env: dev
      spec:
        containers:
          - name: nginx
            image: nginx:latest
            ports:
              - containerPort: 80