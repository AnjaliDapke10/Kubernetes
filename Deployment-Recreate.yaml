apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-set-recreate
spec: 
  replicas: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: nginx
          image: nginx
          ports:
            - containerPort: 80


      