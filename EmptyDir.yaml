apiVersion: v1
kind: Pod
metadata:
  name: empty-dir-volume
spec:
  containers:
  - name: volume-empty-dir
    image: nginx
    resources:
      limits:
        cpu: 200m
        memory: 500Mi
      requests:
        cpu: 100m
        memory: 200Mi
    ports:
    - containerPort:  80
      name:  http
    volumeMounts:
    - name: cache-volume
      mountPath: /cache
  volumes:
    - name: cache-volume
      emptyDir: {}