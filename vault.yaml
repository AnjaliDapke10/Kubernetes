
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  namespace: vault-eso-practice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      containers:
        - name: vault
          image: hashicorp/vault:1.20
          args:
            - server
            - -dev
            - -dev-listen-address=0.0.0.0:8200
          env:
            - name: VAULT_DEV_ROOT_TOKEN_ID
              value: root
          ports:
            - name: http
              containerPort: 8200
