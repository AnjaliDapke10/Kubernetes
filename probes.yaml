apiVersion: v1 
kind: Pod 
metadata: 
  name: simple-probe-pod 
spec: 
  containers: 
  - name: nginx 
    image: nginx:alpine 
    ports: 
    - containerPort: 80 
 
    # 1. LIVENESS PROBE: Restarts container if it stops responding 
    livenessProbe: 
      tcpSocket: 
        port: 80 
      initialDelaySeconds: 5  # Wait 5 seconds after boot before checking 
      periodSeconds: 10       # Check every 10 seconds 
 
    # 2. READINESS PROBE: Stops sending traffic if the app isn't ready 
    readinessProbe: 
      tcpSocket: 
        port: 80 
      initialDelaySeconds: 3  # Wait 3 seconds before checking traffic readiness 
      periodSeconds: 5        # Check every 5 seconds