apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3-storage

provisioner: ebs.csi.aws.com     #It tells Kubernetes which storage plugin creates volumes.
parameters:                      #Storage-specific settings.
  type: gp3
  fsType: ext4

reclaimPolicy: Delete             #Determines what happens when PVC is deleted.
allowVolumeExpansion: true        #Allows increasing disk size later.
volumeBindingMode: Immediate      #Controls when the volume gets created.
