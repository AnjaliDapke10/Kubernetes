apiVersion: v1
kind: ReplicationController
metadata:
  name: nginx-rc
  labels:
    app: nginxApp
spec:
  replicas: 3
  selector:
    app: nginxApp
  template:
    metadata:
      labels: 
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx
          ports:
           - containerPort: 80