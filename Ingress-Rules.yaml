apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /   #URL rewriting
spec:
  rules:
  - host: amazon.com
    http:
      paths:
      - path: "/"
        pathType: Prefix
        backend:
          service:
            name: amazon-home-svc
            port:
              number: 80

      - path: "/mobile"
        pathType: Prefix
        backend:
          service:
            name: amazon-home-svc
            port:
              number: 80

